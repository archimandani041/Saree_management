name: Continuous Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Build, Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci || npm install
          npm run install:all

      - name: Run Client Linting (Oxlint)
        run: npm run lint

      - name: Run Backend Unit Tests
        run: npm test

      - name: Verify Client Production Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://mock-ci-project.supabase.co
          VITE_SUPABASE_ANON_KEY: mock-ci-anon-key-placeholder-for-build
          VITE_API_URL: http://localhost:5001/api
